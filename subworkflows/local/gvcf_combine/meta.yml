# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "gvcf_combine"
description: Perform GVCF combination and joint genotyping operations to combine family trio GVCFs into a single VCF.
keywords:
  - gvcf
  - vcf
  - genotyping
  - joint-calling
  - gatk
  - family
  - trio
components:
  - gatk4/combinegvcfs
  - gatk4/genotypegvcfs
  - bcftools/annotate

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing family information
          e.g. [ id:'family_001', proband_id:'proband_001', mother_id:'mother_001', father_id:'father_001', sv_p:'path/to/proband', sv_m:'path/to/mother', sv_f:'path/to/father' ]
    - gvcfs:
        type: file
        description: List of GVCF files for family trio (proband, mother, father) to be combined and genotyped
        pattern: "*.{gvcf.gz}"
    - tbis:
        type: file
        description: Tabix index files for input GVCF files
        pattern: "*.tbi"
        ontologies:
        - edam: "http://edamontology.org/format_3616"

output:
  - vcf:
      - meta:
          type: map
          description: |
            Groovy Map containing family information
            e.g. [ id:'family_001', proband_id:'proband_001', mother_id:'mother_001', father_id:'father_001', sv_p:'path/to/proband', sv_m:'path/to/mother', sv_f:'path/to/father' ]
      - vcf:
          type: file
          description: Final VCF file containing genotyped variants from family trio members after joint calling and annotation cleanup
          pattern: "*.vcf.gz"
          ontologies:
          - edam: "http://edamontology.org/format_3016"
      - tbi:
          type: file
          description: Tabix index for the final VCF file
          pattern: "*.tbi"
          ontologies:
          - edam: "http://edamontology.org/format_3616"
  - versions:
      - versions:
          type: file
          description: File containing software versions
          pattern: "versions.yml"
          ontologies:
          - edam: "http://edamontology.org/format_3750"
          
authors:
  - "@saramenasantamaria"

maintainers:
  - "@saramenasantamaria"
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: filter_lowconf
description: Apply hard filters to produce final high-confidence preprocessed VCF per family.
keywords:
  - vcf
  - filtering
  - quality-control
  - biallelic
  - trio
  - bcftools
components:
  - bcftools/setgt
  - bcftools/setgt/vaf
  - bcftools/view/exclude

input:
  - ch_vcfs:
      type: channel
      description: |
        Channel containing family metadata, VCF file to be filtered and its tabix index
        Structure: [ meta, vcf, tbi ]
        Where meta is a Groovy Map containing family information
        e.g. [ id:'family_001', sv_p:'path/to/proband', sv_m:'path/to/mother', sv_f:'path/to/father' ]
        pattern: "[ meta, *.{vcf.gz}, *.tbi ]"
  - val_perform_intersection:
      type: boolean
      description: |
        Whether intersection was performed in upstream processing. 
        If false, BCFTOOLS_SETGT is applied to set missing genotypes to 0/0.
  - val_apply_vaf_correction:
      type: boolean
      description: |
        Whether to apply VAF-based genotype correction for clear mismatches.
        Corrects 0/1 calls with VAF < 0.15 to 0/0, and VAF > 0.85 to 1/1.

output:
  - vcf:
      type: channel
      description: |
        Channel containing family metadata, filtered VCF file and its tabix index
        Structure: [ meta, vcf, tbi ]
        The VCF file in this channel represents the final high-confidence VCF after all filtering steps:
        1. Biallelic SNPs only (exclude multiallelic)
        2. Minimum GQ/DP thresholds (configurable via params.GQ_min, params.DP_min)
        3. Exclude all-reference homozygous variants (0/0 or 0|0 in all trio members)
        4. Exclude problematic genomic regions (centromeres, segmental duplications, HLA/KIR)
        pattern: "[ meta, *.{vcf.gz}, *.tbi ]"

authors:
  - "@saramenasantamaria"

maintainers:
  - "@saramenasantamaria"
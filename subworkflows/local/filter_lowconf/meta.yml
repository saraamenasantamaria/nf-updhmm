# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "FILTER_LOWCONF"
description: Apply sequential hard filters to produce final high-confidence preprocessed VCF per family.
keywords:
  - vcf
  - filtering
  - quality control
  - biallelic
  - genotype quality
  - depth
  - genomic regions
  - centromeres
  - segmental duplications
  - HLA
  - KIR
  - bcftools
  - family
  - trio
components:
  - setgt
  - bcftools/view

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing family information (family ID and SV paths)
          e.g. [ id:'family_001', sv_p:'path/to/proband', sv_m:'path/to/mother', sv_f:'path/to/father' ]
    - vcf:
        type: file
        description: Input VCF file to be filtered for quality and problematic genomic regions
        pattern: "*.{vcf.gz}"
    - tbi:
        type: file
        description: Tabix index file for input VCF
        pattern: "*.tbi"

output:
  - - meta:
          type: map
          description: |
            Groovy Map containing family information (family ID and SV paths)
            e.g. [ id:'family_001', sv_p:'path/to/proband', sv_m:'path/to/mother', sv_f:'path/to/father' ]
      - vcf:
          type: file
          description: |
            Final filtered high-confidence VCF file after applying sequential filters:
            (1) biallelic sites only, (2) exclude all-reference-homozygous variants,
            (3) minimum GQ/DP thresholds enforced, (4) exclude problematic genomic regions
            (centromeres, segmental duplications, HLA/KIR regions)
          pattern: "*.{vcf.gz}"
      - tbi:
          type: file
          description: Tabix index file for final filtered VCF
          pattern: "*.tbi"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"  

authors:
  - "@saramenasantamaria"

maintainers:
  - "@saramenasantamaria"
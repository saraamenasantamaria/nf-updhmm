# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "COMBINE_VCF"
description: Perform VCF intersection and merge operations to combine family trio VCFs into a single merged VCF
keywords:
  - vcf
  - intersection
  - merge
  - bcftools
  - family
  - trio
  - combine
components:
  - bcftools/isec
  - bcftools/merge
input:
  - vcfs_ch:
      type: channel
      description: |
        Channel containing family metadata, VCF files, and corresponding index files
        for trio intersection and merging operations
      pattern: "[meta, vcfs, tbis]"
      structure:
        - meta: Family metadata map containing family ID and SV paths
        - vcfs: List of VCF files [proband, mother, father] to be intersected and merged
        - tbis: List of corresponding VCF index files
output:
  - vcfs:
      type: channel
      description: Merged VCF file with index containing variants from family trio members after optional intersection
      pattern: "[meta, vcf, tbi]"
      structure:
        - meta: Family metadata map
        - vcf: Merged VCF file
        - tbi: VCF index file
  - versions:
      type: channel
      description: Channel containing software versions
      pattern: "versions.yml"
authors:
  - "@saramenasantamaria"
maintainers:
  - "@saramenasantamaria"
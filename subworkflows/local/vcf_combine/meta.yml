# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "vcf_combine"
description: Perform VCF intersection and merge operations to combine family trio VCFs into a single merged VCF
keywords:
  - vcf
  - intersection
  - merge
  - bcftools
  - family
  - trio
components:
  - bcftools/isec
  - bcftools/merge

input:
  - ch_vcfs:
      type: channel
      description: |
        Channel containing family metadata, list of VCF files and their tabix indices
        Structure: [ meta, vcfs, tbis ]
        Where meta is a Groovy Map containing family information (family ID and SV paths)
        e.g. [ id:'family_001', sv_p:'path/to/proband', sv_m:'path/to/mother', sv_f:'path/to/father' ]
        vcfs: List of VCF files for family trio (proband, mother, father) to be intersected and merged
        tbis: Tabix index files for input VCF files
      pattern: "[ meta, [*.vcf.gz], [*.tbi] ]"
  - val_perform_intersection:
      type: boolean
      description: |
        Whether to perform intersection before merging.
        If true, only shared variants among trio members are retained (intersection mode).
        If false, all variants from the trio are combined directly (union mode).

output:
  - vcf:
      type: channel
      description: |
        Channel containing family metadata, merged VCF file and its tabix index
        Structure: [ meta, vcf, tbi ]
        Where vcf is the merged VCF file containing variants from family trio members after optional intersection
        and tbi is the tabix index file for the merged VCF
      pattern: "[ meta, *.vcf.gz, *.tbi ]"
  
authors:
  - "@saramenasantamaria"

maintainers:
  - "@saramenasantamaria"
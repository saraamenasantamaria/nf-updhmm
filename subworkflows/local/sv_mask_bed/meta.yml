# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "SV_MASK_BED"
description: Filter structural variants using BED regions by concatenating, merging, and applying region masks
keywords:
  - structural variants
  - BED regions
  - filtering
  - masking
  - vcf
  - bcftools
  - bedtools
components:
  - concat_bed
  - bedtools/merge
  - bcftools/view
  - bcftools/query
input:
  - sv_paths_ch:
      type: channel
      description: |
        Channel containing sample metadata with structural variant paths, VCF files (BED/VCF or '-' if none) and their indices
      pattern: "[meta, vcf, tbi]"
      structure:
        - meta: Family metadata map containing family ID and SV paths
        - vcf: Input VCF file to be filtered
        - tbi: Input VCF index file
output:
  - vcfs:
      type: channel
      description: |
        Processed VCF files with structural variants filtered out using BED masks.
        For samples without SVs, VCFs are passed through unmodified.
      pattern: "[meta, vcf, tbi]"
      structure:
        - meta: Family metadata map
        - vcf: Filtered VCF file (or original if no SVs)
        - tbi: VCF index file
  - versions:
      type: channel
      description: |
        Channel containing software versions
      pattern: "versions.yml"
authors:
  - "@saramenasantamaria"
maintainers:
  - "@saramenasantamaria"
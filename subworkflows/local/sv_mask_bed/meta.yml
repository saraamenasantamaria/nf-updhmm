# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "sv_mask_bed"
description: Filter structural variants from VCF files using BED regions as masks
keywords:
  - vcf
  - bed
  - structural variants
  - filtering
  - masking
  - bcftools
  - bedtools
  - family
  - trio
components:
  - custom/bedconcat
  - bedtools/merge
  - bcftools/view
  - bcftools/view/exclude
  - bcftools/query

input:
  - ch_vcfs:
      type: channel
      description: |
        Channel containing family metadata, VCF file to be filtered and its tabix index
        Structure: [ meta, vcf, tbi ]
        Where meta is a Groovy Map containing family information and SV paths
        e.g. [ id:'family_001', sv_p:'path/to/proband.bed', sv_m:'path/to/mother.vcf.gz', sv_f:'-' ]
        SV paths can be BED files, VCF.GZ files, or '-' for samples without SVs
      pattern: "[ meta, *.vcf.gz, *.tbi ]"
  - val_apply_vaf_filter:
      type: boolean
      description: Whether to apply additional VAF-based filtering for ambiguous variants after SV masking.

output:
  - vcf:
      type: channel
      description: |
        Channel containing family metadata, filtered VCF file and its tabix index
        Structure: [ meta, vcf, tbi ]
        Filtered VCF file with structural variants masked and optionally VAF-filtered,
        or original VCF if no SV files provided
      pattern: "[ meta, *.vcf.gz, *.tbi ]"

authors:
  - "@saramenasantamaria"

maintainers:
  - "@saramenasantamaria"
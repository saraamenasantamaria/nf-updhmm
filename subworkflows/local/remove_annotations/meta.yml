# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "remove_annotations"
description: Index VCF/GVCF files, filter autosomes, remove unused annotations from individual files, and regroup by family
keywords:
  - vcf
  - gvcf
  - annotations
  - bcftools
  - family
  - trio
  - filtering
  - autosomes
components:
  - tabix/tabix
  - bcftools/view
  - bcftools/annotate
  - bcftools/query
  
input:
  - ch_samples:
      type: channel
      description: |
        Channel containing family metadata and list of VCF/GVCF files
        Structure: [ meta, vcfs ]
        Where meta is a Groovy Map containing family information (family ID and SV paths)
        e.g. [ id:'family_001', sv_p:'path/to/proband', sv_m:'path/to/mother', sv_f:'path/to/father' ]
        vcfs: List of VCF/GVCF files for family trio (proband, mother, father)
      pattern: "[ meta, [*.vcf.gz] ]"
  - val_is_gvcf:
      type: boolean
      description: Whether input files are GVCFs (true) or VCFs (false). Determines annotation removal strategy.

output:
  - vcf:
      type: channel
      description: |
        Channel containing family metadata, processed VCF/GVCF files and their tabix indices
        Structure: [ meta, vcfs, tbis ]
        Where vcfs are processed VCF/GVCF files filtered for autosomes with annotations removed
        and tbis are the corresponding tabix index files
        Files are sorted by role: proband, mother, father
      pattern: "[ meta, [*.vcf.gz], [*.tbi] ]"
       
authors:
  - "@saramenasantamaria"
  
maintainers:
  - "@saramenasantamaria"
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "REMOVE_ANNOTATIONS"
description: Filter autosomes, remove unused annotations from individual VCFs, and regroup by family.
keywords:
  - vcf
  - annotations
  - bcftools
  - family
  - trio
  - filtering
  - autosomes
components:
  - tabix/tabix
  - bcftools/view
  - bcftools/annotate
input:
  - samples_ch:
      type: channel
      description: |
        Channel containing family metadata and VCF files for trio analysis
      pattern: "[meta, vcfs]"
      structure:
        - meta: Family metadata map containing family ID and SV paths
        - vcfs: List of VCF files [proband, mother, father] in order
output:
  - vcfs:
      type: channel
      description: |
        Processed VCF files with annotations removed and filtered for autosomes, 
        regrouped by family. Each family contains processed VCFs for proband, mother, 
        and father with corresponding index files.
      pattern: "[meta, vcfs, tbis]"
      structure:
        - meta: Family metadata map
        - vcfs: List of processed VCF files [proband, mother, father] in order
        - tbis: List of corresponding VCF index files [proband, mother, father] in order
  - versions:
      type: channel
      description: Channel containing software versions
      pattern: "versions.yml"
authors:
  - "@saramenasantamaria"
maintainers:
  - "@saramenasantamaria"
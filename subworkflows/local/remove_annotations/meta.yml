# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "REMOVE_ANNOTATIONS"
description: Index VCF/GVCF files, filter autosomes, remove unused annotations from individual files, and regroup by family
keywords:
  - vcf
  - gvcf
  - annotations
  - bcftools
  - family
  - trio
  - filtering
  - autosomes
components:
  - tabix/tabix
  - bcftools/view
  - bcftools/annotate
  
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing family information (family ID and SV paths)
          e.g. [ id:'family_001', sv_p:'path/to/proband', sv_m:'path/to/mother', sv_f:'path/to/father' ]
    - vcfs:
        type: file
        description: List of VCF/GVCF files for family trio (proband, mother, father)
        pattern: "*.{vcf.gz}"

output:
  - - meta:
        type: map
        description: |
          Groovy Map containing family information (family ID and SV paths)
          e.g. [ id:'family_001', sv_p:'path/to/proband', sv_m:'path/to/mother', sv_f:'path/to/father' ]
    - vcfs:
        type: file
        description: Processed VCF/GVCF files filtered for autosomes with annotations removed
        pattern: "*.{vcf.gz}"
    - tbis:
        type: file
        description: Tabix index files for processed VCF/GVCF files
        pattern: "*.tbi"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"   
       
authors:
  - "@saramenasantamaria"
  
maintainers:
  - "@saramenasantamaria"
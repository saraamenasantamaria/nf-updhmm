name: "CONCAT_BED"
description: "Concatenate multiple BED files containing structural variant regions, clean and sort entries"
keywords:
  - "bed"
  - "structural variants"
  - "concatenate"

tools:
  - "bash":
      description: "GNU Bourne Again shell"
      homepage: "https://www.gnu.org/software/bash/"
      documentation: "https://www.gnu.org/software/bash/manual/"
      licence: ["GPL-3.0-or-later"]
  - "awk":
      description: "Pattern scanning and processing language"
      homepage: "https://www.gnu.org/software/gawk/"
      documentation: "https://www.gnu.org/software/gawk/manual/"
      licence: ["GPL-3.0-or-later"]
  - "sort":
      description: "Sort lines of text files"
      homepage: "https://www.gnu.org/software/coreutils/"
      documentation: "https://www.gnu.org/software/coreutils/manual/"
      licence: ["GPL-3.0-or-later"]
  - "uniq":
      description: "Report or omit repeated lines"
      homepage: "https://www.gnu.org/software/coreutils/"
      documentation: "https://www.gnu.org/software/coreutils/manual/"
      licence: ["GPL-3.0-or-later"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - beds:
      type: file
      description: |
        One or more BED files containing structural variant regions.
        Can be a single file or a list of files from different sources.
        Each file should contain at least 3 columns: chromosome, start, end.
      pattern: "*.{bed,BED}"

output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - bed:
      type: file
      description: |
        Concatenated, cleaned, sorted, and deduplicated BED file.
        Contains only the first 3 columns (chromosome, start, end).
        Sorted by chromosome and start position.
      pattern: "*_svs_concatenated.bed"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@saramenasantamaria"
maintainers:
  - "@saramenasantamaria"
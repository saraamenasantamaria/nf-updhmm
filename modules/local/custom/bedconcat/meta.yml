name: custom_bedconcat
description: Concatenate, clean, sort and deduplicate multiple BED files
keywords:
  - bed
  - concatenate
  - sort
  - deduplicate
  - merge
  - genomic regions
tools:
  - coreutils:
      description: |
        GNU core utilities including cat, awk, sort, and uniq for text processing. 
        This module uses these tools to concatenate multiple BED files, extract the 
        first three columns (chrom, start, end), sort by coordinates, and remove duplicates.
      homepage: https://www.gnu.org/software/coreutils/
      documentation: https://www.gnu.org/software/coreutils/manual/
      licence:
        - "GPL-3.0-or-later"
      identifier: ""
      args_id: "$args"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - beds:
        type: file
        description: |
          List of BED files containing genomic regions to concatenate. 
          Only the first three BED columns (chromosome, start, end) are 
          retained in the output.
        pattern: "*.bed"
        ontologies:
          - edam: "http://edamontology.org/format_3003"
output:
  bed:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.bed":
          type: file
          description: |
            Concatenated, sorted and deduplicated BED file containing only the 
            first three columns (chromosome, start, end) sorted by genomic coordinates.
          pattern: "*.bed"
          ontologies:
            - edam: "http://edamontology.org/format_3003"
  versions_coreutils:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - coreutils:
          type: string
          description: The tool name
      - coreutils --version | head -n1 | cut -d' ' -f4:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - coreutils:
          type: string
          description: The tool name
      - coreutils --version | head -n1 | cut -d' ' -f4:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@saramenasantamaria"
maintainers:
  - "@saramenasantamaria"
